repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy src/browser_use_mcp tests
        language: system
        pass_filenames: false
        types_or: [python, pyi]
